# The framework wrapper, and nothing else.
#
# `Package.swift` beside this file is the real project: sources, tests, and what
# anyone developing the renderer builds. This file exists for one reason —
# SwiftPM cannot produce a `.framework`, and an `.xcframework` is what a binary
# consumer links. So the same sources are compiled once more, here, as a
# framework target, and `Scripts/build-xcframework.sh` wraps the result.
#
# Dynamic, like its siblings `RMLines` and `RMMarks`: Xcode embeds a package's
# binary framework into the application bundle whatever it holds, and one copy
# shared through `Contents/Frameworks` keeps a type from existing twice in a
# process.
#
# The two dependencies are resolved from their public repositories, the same
# versions `Package.swift` asks for.
#
# Generated project, not committed: run the script.
name: RMRender

options:
  bundleIdPrefix: io.altessa
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  rmlines-swift:
    url: https://github.com/altessa-s/rmlines-swift.git
    from: 1.0.1
  rmmarks-swift:
    url: https://github.com/altessa-s/rmmarks-swift.git
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    # What makes the module readable by a later compiler than the one that built
    # it: the `.swiftinterface` beside the binary module.
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULE_DEBUGGING: "NO"

targets:
  RMRender:
    type: framework
    # One target, three slices — not three targets. `supportedDestinations`
    # keeps the scheme, the product name and the module name single; a target
    # split per platform would give XcodeGen leave to suffix all three, and the
    # script below archives by scheme name.
    supportedDestinations: [macOS, iOS]
    sources:
      # The Swift, without the three resource folders: they are added below as
      # folder references so that their directory names survive into
      # `Resources/`, which is what `Bundle.module` addressing depends on.
      - path: Sources/RMRender
        excludes:
          - Fonts
          - Grain
          - Templates
      - path: Sources/RMRender/Fonts
        type: folder
      - path: Sources/RMRender/Grain
        type: folder
      - path: Sources/RMRender/Templates
        type: folder
    dependencies:
      - package: rmlines-swift
        product: RMLines
      - package: rmmarks-swift
        product: RMMarks
    settings:
      base:
        PRODUCT_NAME: RMRender
        PRODUCT_MODULE_NAME: RMRender
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "NO"
        INSTALL_PATH: /Library/Frameworks
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.altessa.rmrender
        # What a local build calls itself, and it is not a version: 0.0.0 says
        # "not a release". A release overrides it with the tag, through
        # `Scripts/build-xcframework.sh`, so a local build never outranks a
        # published one.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # `Bundle.module` is SwiftPM's; this build defines its own — see
        # BundleModule.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: RMRENDER_FRAMEWORK
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: "NO"
