# SwiftLint for RMRender. Run it from the repository root: `swiftlint`.
#
# What this configuration is for: the mechanical mistakes a reader stops
# noticing — a force unwrap that takes the whole run down with a signal,
# `count == 0` where `isEmpty` was meant, a `%` that means `isMultiple(of:)`.
# What it is deliberately not for is the shape of the code. Those decisions
# this package has already made and written down in the comments above each
# one, and a linter repeating them at every build teaches nothing that review
# does not.
#
# Every rule that is off is off for a reason given on the spot. The long files
# are long on purpose — `PageRenderer.swift`, `Calibration.swift`,
# `RenderTextTests.swift` and `RenderParseTests.swift` among them.

excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  # Generated by XcodeGen and not committed; named so that this file and
  # `.gitignore` agree on it.
  - RMRender.xcodeproj

disabled_rules:
  # Size and complexity, the whole family. A page renderer, a PDF writer and a
  # calibration table are long because the thing they describe is long, and the
  # long files are the shape the package asks for rather than a defect that
  # survived review. Counted over Sources and Tests when they were switched
  # off — 58 violations between the six:
  #
  #   file_length             17   (9 of sources, 8 of tests)
  #   function_body_length    12
  #   cyclomatic_complexity   12   (up to 25, in the drawing of a page: the
  #                                 branches are the format's, not the
  #                                 function's)
  #   nesting                  6   (all of them NotebookRenderer.Content —
  #                                 `Pages.Entry.Stamped` mirrors the shape of
  #                                 the `.content` JSON, and flattening it would
  #                                 name four types after their own path)
  #   function_parameter_count 6   (up to 7: a draw call takes the geometry it
  #                                 draws into, and a struct per call site
  #                                 would be six types nobody reads)
  #   type_body_length         5   (the four renderers and TextGeometry)
  #
  # A rule that fires fifty-eight times on deliberate work trains people to
  # read past it, and then it is not there for the case that matters.
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting

  # 71 trailing commas in multi-line literals, consistently, and not one place
  # the rule would have found a mistake. That is a house style, and the linter
  # does not get a vote.
  - trailing_comma

  # Fourteen occurrences, and the rule has them backwards here. It pushes
  # `String(decoding:as:)` towards the failable `String(bytes:encoding:)`, and
  # this package wants the total one: it reads the tokens and names of a PDF
  # somebody else wrote, and a byte that is not UTF-8 belongs in the string as
  # a replacement character rather than as a `nil` that would lose the object
  # it names.
  - optional_data_string_conversion

opt_in_rules:
  # Rules that are off by default and earn their place here: each one names a
  # spelling that hides intent — a count compared to zero, a filter whose only
  # use is `isEmpty`, a `%` that means `isMultiple(of:)`.
  #
  # They are guards, not clean-up: the first one to fire is new work, and is
  # looked at.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  # No force unwraps, product code and tests alike. Tests are not exempt: a `!`
  # there ends the whole run with a signal, so the case that failed is the one
  # thing the output does not name.
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# `x`, `y`, `dx`, `dy`, `u`, `v`, `p0`…`p3`, `sx`, `sy` — 94 of them, and every
# one is a coordinate, an offset or a control point inside a point, a curve or
# a rectangle. Short names are the readable ones there, and `xCoordinate` would
# be a worse name, not a longer one. `a4` is in the list too, and renaming a
# paper size is not an improvement. The ceiling stays, because a forty-character
# name is a different problem.
identifier_name:
  min_length: 1

# Three members is what the tree actually holds, in 23 places; at four the rule
# finds nothing, because there is nothing to find. Four is where a tuple stops
# being readable and wants a name.
large_tuple:
  warning: 3

# Prose is exempt — the long explanations above declarations are the point of
# this package, and wrapping them to a column would only make them worse. What
# is left is code, and the longest line of it in the tree is 133 columns, in a
# test. The ceiling is a bound on what may be added rather than a description
# of what is there.
line_length:
  warning: 150
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true
